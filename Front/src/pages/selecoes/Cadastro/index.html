<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar-Seleções</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <a href="../../../../index.html" class="btnVoltar">⬅ Voltar</a>

    <div class="container">
        
        <h1>Cadastrar Seleções</h1>
        <form action="" id="FormSelecao">
            
                <div>
                    <label for="">Nome:</label>   
                    <input type="text" id="nomeSelecao" required>
                </div>
                <div>
                    <label for="">Técnico:</label>
                    <input type="text"  id="tecnicoSelecao" required>
                </div>
                <div>
                    <label for="">Logo/Url:</label>
                    <input type="text" id="logoSelecao" required>
                </div>
                <div>
                    <label for="">Grupo:</label>
                    <select name="" id="grupoSelect">
                        <option value=""></option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                        <option value="E">E</option>
                        <option value="F">F</option>
                        <option value="G">G</option>
                        <option value="H">H</option>
                        <option value="I">I</option>
                        <option value="J">J</option>
                        <option value="K">K</option>
                        <option value="L">L</option>
                    </select>
                </div>
                <div>
                    <button type="submit">Cadastrar</button>
                </div>
        </form>
                 <div class="flagPreviewContainer">
                <img src="" alt="" id="flagPreview">
                </div>

    </div>
    <script type="module" src="index.js"></script>
</body>
</html>
